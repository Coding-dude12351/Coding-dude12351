name: Update DevCard

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update DevCard Image
        run: |
          curl -o devcard.png https://api.daily.dev/devcards/yourdevcardid.png?r=$RANDOM
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add devcard.png
          git commit -m "Update DevCard"
          git push
